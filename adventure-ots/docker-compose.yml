services:
  # ========================================
  # Baza danych - MariaDB 10.11 LTS
  # ========================================
  db:
    image: mariadb:10.11
    container_name: ots_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: twoje_haslo
      MYSQL_DATABASE: ots_baza
      MYSQL_USER: forgottenserver
      MYSQL_PASSWORD: tibia_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./tfs/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ots_network

  # ========================================
  # Silnik gry - The Forgotten Server 1.4.2
  # ========================================
  gameserver:
    build:
      context: ./tfs
      dockerfile: Dockerfile
    container_name: ots_engine
    restart: unless-stopped
    ports:
      - "7171:7171"
      - "7172:7172"
    volumes:
      - ./tfs/config.lua:/srv/config.lua
      - ./tfs/data:/srv/data
      - ./tfs/schema.sql:/srv/schema.sql
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ots_network

  # ========================================
  # AAC Backend - Node.js + TypeScript API
  # ========================================
  aac-backend:
    build:
      context: ./aac-backend
      dockerfile: Dockerfile
    container_name: aac_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: twoje_haslo
      DB_NAME: ots_baza
      JWT_SECRET: adventure-ots-jwt-secret-change-me
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ots_network

  # ========================================
  # AAC Frontend - Next.js SPA
  # ========================================
  aac-frontend:
    build:
      context: ./aac-frontend
      dockerfile: Dockerfile
    container_name: aac_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
    volumes:
      - ./aac-frontend/public/downloads:/app/public/downloads:ro
    depends_on:
      - aac-backend
    networks:
      - ots_network

  # ========================================
  # Nginx - Reverse Proxy
  # ========================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aac_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./aac-frontend/public/downloads:/srv/downloads:ro
    depends_on:
      - aac-backend
      - aac-frontend
    networks:
      - ots_network

volumes:
  db_data:
    driver: local

networks:
  ots_network:
    driver: bridge
