services:
  # ========================================
  # Baza danych - MariaDB 10.11 LTS
  # ========================================
  db:
    image: mariadb:10.11
    container_name: ots_db
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      MYSQL_ROOT_PASSWORD: twoje_haslo
      MYSQL_DATABASE: ots_baza
      MYSQL_USER: forgottenserver
      MYSQL_PASSWORD: tibia_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./tfs/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ots_network

  # ========================================
  # Silnik gry - The Forgotten Server 1.4.2
  # ========================================
  gameserver:
    build:
      context: ./tfs
      dockerfile: Dockerfile
    container_name: ots_engine
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    ports:
      - "7171:7171"
      - "7172:7172"
    volumes:
      - ./tfs/config.lua:/srv/config.lua
      - ./tfs/data:/srv/data
      - ./tfs/schema.sql:/srv/schema.sql
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ots_network

  # ========================================
  # Backend - Node.js + TypeScript API
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: twoje_haslo
      DB_NAME: ots_baza
      JWT_SECRET: adventure-ots-jwt-secret-change-me
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ots_network

  # ========================================
  # Frontend - Next.js SPA
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      NEXT_PUBLIC_API_URL: /api
    volumes:
      - ./frontend/public/downloads:/app/public/downloads:ro
    depends_on:
      - backend
    networks:
      - ots_network

  # ========================================
  # Nginx - Reverse Proxy
  # ========================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: proxy
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    ports:
      - "80:80"
    volumes:
      - ./frontend/public/downloads:/srv/downloads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ots_network

  # ========================================
  # Debug Tools (optional profile)
  # Start with: docker compose --profile debug up -d
  # ========================================
  adminer:
    image: adminer:4.8.1
    container_name: ots_adminer
    restart: unless-stopped
    profiles:
      - debug
    environment:
      LOG_LEVEL: info
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ots_network

volumes:
  db_data:
    driver: local

networks:
  ots_network:
    driver: bridge
