name: TFS C++ Build & Lint

on:
  push:
    paths:
      - "adventure-ots/tfs/src/**"
      - "adventure-ots/tfs/CMakeLists.txt"
      - "adventure-ots/tfs/cmake/**"
      - ".github/workflows/cpp-build.yml"
  pull_request:
    paths:
      - "adventure-ots/tfs/src/**"
      - "adventure-ots/tfs/CMakeLists.txt"
      - "adventure-ots/tfs/cmake/**"
      - ".github/workflows/cpp-build.yml"

jobs:
  build:
    name: Build TFS (Ubuntu)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout z submodułami
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            libboost-system-dev \
            libboost-iostreams-dev \
            libboost-locale-dev \
            libfmt-dev \
            libpugixml-dev \
            libssl-dev \
            libmariadb-dev

      - name: Cache build dir
        uses: actions/cache@v4
        with:
          path: build/tfs/
          key: cmake-${{ runner.os }}-${{ hashFiles('adventure-ots/tfs/src/**', 'adventure-ots/tfs/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -S adventure-ots/tfs -B build/tfs \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSKIP_GIT=ON \
            -DBUILD_TESTING=OFF

      - name: Build TFS
        run: cmake --build build/tfs --parallel $(nproc)

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfs-${{ github.sha }}
          path: |
            build/tfs/tfs
            build/tfs/forgottenserver
          retention-days: 7

  lint-cpp:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Analyze TFS sources
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            adventure-ots/tfs/src/