name: Lua Lint (TFS)

on:
  push:
    paths:
      - "adventure-ots/tfs/data/**/*.lua"
      - "adventure-ots/tfs/.luacheckrc"
      - ".github/workflows/lua-lint.yml"
  pull_request:
    paths:
      - "adventure-ots/tfs/data/**/*.lua"
      - "adventure-ots/tfs/.luacheckrc"
      - ".github/workflows/lua-lint.yml"

jobs:
  luacheck:
    name: Luacheck for TFS data/
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: adventure-ots/tfs

    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck via luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Ensure .luacheckrc exists
        run: |
          if [ ! -f ".luacheckrc" ]; then
            echo "Missing .luacheckrc - generating default config for TFS 1.4.2"
            cat > .luacheckrc << 'EOF'
std = "lua51"
max_line_length = 160
ignore = {
  "212", -- unused args (common in handlers)
  "411", -- local variable redefined
}

globals = {
  "Player", "Monster", "Npc", "Creature", "Item", "Tile", "House",
  "Position", "Outfit", "ItemType", "MonsterType",
  "Action", "MoveEvent", "TalkAction", "GlobalEvent", "Spell", "Weapon", "CreatureEvent", "Event",
  "Game", "db", "result", "addEvent", "stopEvent",
  "CONST_ME_NONE", "RETURNVALUE_NOERROR", "TALKTYPE_SAY",
  "NORTH", "SOUTH", "EAST", "WEST", "VOCATION_NONE"
}
EOF
          fi

      - name: Run luacheck
        run: |
          luacheck data/ \
            --config .luacheckrc \
            --exclude-files "data/lib/compatibility*.lua" \
            --formatter plain \
            --codes

      - name: Summary
        if: always()
        run: luacheck data/ --config .luacheckrc --formatter TAP | tail -5