name: macOS OTClient Publish (arm64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-macos-arm64:
    name: Build and publish macOS OTClient arm64
    runs-on: macos-14
    # Guardrail: this workflow only publishes for manual runs and v* tags.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake ninja || true
          cmake --version
          ninja --version

      - name: Verify system architecture
        run: |
          echo "Host architecture: $(uname -m)"
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "ERROR: Runner is not arm64 (Apple Silicon)"
            exit 1
          }

      - name: Bootstrap vcpkg
        run: |
          TEMP_VCPKG="${RUNNER_TEMP}/vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg "$TEMP_VCPKG"
          "$TEMP_VCPKG/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$TEMP_VCPKG" >> "$GITHUB_ENV"
          echo "Bootstrap vcpkg at: $TEMP_VCPKG"

      - name: Resolve version and artifact names
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="${VERSION}"
          fi

          ASSET_BASE="adventure-ots-client-macos-arm64-${VERSION}"
          CANONICAL_ZIP="adventure-ots/frontend/public/downloads/macos/adventure-ots-client-macos-arm64.zip"
          CANONICAL_SHA256="${CANONICAL_ZIP}.sha256"
          OUTPUT_DIR="${RUNNER_TEMP}/otclient-release"
          ZIP_FILE="${OUTPUT_DIR}/${ASSET_BASE}.zip"
          SHA256_FILE="${ZIP_FILE}.sha256"

          mkdir -p "$OUTPUT_DIR"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "canonical_zip=${CANONICAL_ZIP}" >> "$GITHUB_OUTPUT"
          echo "canonical_sha256=${CANONICAL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "zip_file=${ZIP_FILE}" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${SHA256_FILE}" >> "$GITHUB_OUTPUT"

      - name: Run macOS build and package script
        run: |
          chmod +x adventure-ots/clients/mac/tools/build-and-package-macos-arm64.sh
          adventure-ots/clients/mac/tools/build-and-package-macos-arm64.sh

      - name: Verify canonical artifacts
        run: |
          ZIP_FILE="${{ steps.version.outputs.canonical_zip }}"
          SHA256_FILE="${{ steps.version.outputs.canonical_sha256 }}"

          [[ -f "$ZIP_FILE" ]] || {
            echo "ERROR: ZIP artifact not found at $ZIP_FILE"
            exit 1
          }
          [[ -f "$SHA256_FILE" ]] || {
            echo "ERROR: SHA256 checksum file not found at $SHA256_FILE"
            exit 1
          }

          echo "ZIP: $ZIP_FILE"
          ls -lh "$ZIP_FILE"
          echo "SHA256: $SHA256_FILE"
          ls -lh "$SHA256_FILE"

      - name: Prepare versioned release assets
        run: |
          CANONICAL_ZIP="${{ steps.version.outputs.canonical_zip }}"
          ZIP_FILE="${{ steps.version.outputs.zip_file }}"
          SHA256_FILE="${{ steps.version.outputs.sha256_file }}"

          cp "$CANONICAL_ZIP" "$ZIP_FILE"
          (
            cd "$(dirname "$ZIP_FILE")"
            shasum -a 256 "$(basename "$ZIP_FILE")" > "$(basename "$SHA256_FILE")"
          )

          echo "Versioned ZIP: $ZIP_FILE"
          ls -lh "$ZIP_FILE"
          echo "Versioned SHA256: $SHA256_FILE"
          ls -lh "$SHA256_FILE"

      - name: Optional signing and notarization placeholders
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: |
          # TODO: Integrate codesign for OtClient.app using APPLE_SIGNING_IDENTITY.
          if [[ -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo "TODO: Signing identity configured. Add codesign invocation here."
          else
            echo "APPLE_SIGNING_IDENTITY not configured. Skipping signing step."
          fi

          # TODO: Integrate xcrun notarytool submit using APPLE_NOTARY_PROFILE.
          if [[ -n "${APPLE_NOTARY_PROFILE}" ]]; then
            echo "TODO: Notary profile configured. Add notarization invocation here."
          else
            echo "APPLE_NOTARY_PROFILE not configured. Skipping notarization step."
          fi

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Automated macOS arm64 OTClient release assets." \
              --target "${GITHUB_SHA}"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Manual macOS arm64 OTClient publish run ${GITHUB_RUN_NUMBER}." \
              --target "${GITHUB_SHA}" \
              --prerelease
          fi

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ZIP_FILE: ${{ steps.version.outputs.zip_file }}
          SHA256_FILE: ${{ steps.version.outputs.sha256_file }}
        run: |
          gh release upload "$RELEASE_TAG" "$ZIP_FILE" "$SHA256_FILE" --clobber
