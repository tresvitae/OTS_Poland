<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure OTS Login Test Form</title>
  <style>
    :root {
      --bg: #11151f;
      --card: #1a2333;
      --line: #2d3a55;
      --text: #f2f4f8;
      --muted: #b8c2d1;
      --accent: #c8a24f;
      --danger: #ff7474;
      --ok: #77d08b;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #263149 0%, var(--bg) 55%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .card {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.3rem;
      color: var(--accent);
    }
    .grid {
      display: grid;
      gap: 10px;
    }
    label {
      font-size: 0.84rem;
      color: var(--muted);
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f1622;
      color: var(--text);
      padding: 10px;
      margin-top: 4px;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button {
      border: 1px solid var(--line);
      background: #22314b;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      min-height: 1.2rem;
      color: var(--muted);
    }
    .status.error {
      color: var(--danger);
    }
    .status.ok {
      color: var(--ok);
    }
    pre {
      margin-top: 10px;
      background: #0f1622;
      border: 1px solid var(--line);
      padding: 10px;
      border-radius: 8px;
      max-height: 220px;
      overflow: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Adventure OTS Login Test Form</h1>
    <div class="grid">
      <label>
        API Base URL
        <input id="apiBase" value="http://localhost/api" />
      </label>
      <label>
        Account name
        <input id="name" value="Patryk" />
      </label>
      <label>
        Password
        <input id="password" value="test" type="password" />
      </label>
      <label>
        Email (for register)
        <input id="email" value="patryk.test@adventure.ots" />
      </label>
    </div>

    <div class="row">
      <button id="registerBtn" type="button">Register</button>
      <button id="loginBtn" type="button">Login</button>
      <button id="charactersBtn" type="button">Get Characters (auth)</button>
    </div>

    <div id="status" class="status">Ready.</div>
    <pre id="result">{}</pre>
  </section>

  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    let token = '';

    function getInput(id) {
      return document.getElementById(id).value.trim();
    }

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status ok';
    }

    async function send(method, path, body, requiresAuth) {
      const apiBase = getInput('apiBase').replace(/\/$/, '');
      const headers = { 'Content-Type': 'application/json' };
      if (requiresAuth && token) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      const response = await fetch(apiBase + path, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await response.json();
      resultEl.textContent = JSON.stringify({ status: response.status, data }, null, 2);
      if (!response.ok) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      return data;
    }

    document.getElementById('registerBtn').addEventListener('click', async () => {
      try {
        const data = await send('POST', '/account/register', {
          name: getInput('name'),
          password: getInput('password'),
          email: getInput('email'),
        });
        setStatus(`Register succeeded: ${data.message || 'ok'}`, false);
      } catch (error) {
        setStatus(`Register failed: ${error.message}`, true);
      }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      try {
        const data = await send('POST', '/account/login', {
          name: getInput('name'),
          password: getInput('password'),
        });
        token = data.token || '';
        setStatus('Login succeeded. JWT token captured for auth checks.', false);
      } catch (error) {
        token = '';
        setStatus(`Login failed: ${error.message}`, true);
      }
    });

    document.getElementById('charactersBtn').addEventListener('click', async () => {
      try {
        await send('GET', '/account/characters', null, true);
        setStatus('Authenticated character fetch succeeded.', false);
      } catch (error) {
        setStatus(`Characters fetch failed: ${error.message}`, true);
      }
    });
  </script>
</body>
</html>
